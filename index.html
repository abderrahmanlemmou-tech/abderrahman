<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Leap - المغامرة الكبرى</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            flex-direction: column;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            border: 4px solid #16213e;
            background-color: #0f3460;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .top-bar {
            display: flex;
            justify-content: space-around;
            width: 800px;
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffdd59;
        }
        .shop-btn-main {
            padding: 8px 16px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        /* نافذة المتجر (Modal) */
        .shop-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .shop-content {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            border: 2px solid #e94560;
        }
        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .item-card {
            background: #0f3460;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ffdd59;
        }
        .item-card button {
            margin-top: 5px;
            padding: 5px 10px;
            background: #2ed573;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        .close-shop {
            margin-top: 15px;
            padding: 8px 15px;
            background: #e94560;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>Pixel Leap - رحلة الوصول إلى البيت</h2>
        <div class="top-bar">
            <div>المرحلة: <span id="levelNum">1</span></div>
            <div>الذهب: <span id="coinCount">0</span> 🪙</div>
            <button class="shop-btn-main" onclick="openShop()">🛍️ فتح المتجر</button>
        </div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <!-- نافذة المتجر -->
    <div class="shop-modal" id="shopModal">
        <div class="shop-content">
            <h3>🛍️ متجر الشخصيات والأشكال</h3>
            <div class="shop-grid" id="shopGrid"></div>
            <button class="close-shop" onclick="closeShop()">إغلاق المتجر</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let coins = 0;
        let currentLevel = 1;

        // إعدادات اللاعب
        const player = {
            x: 40,
            y: 300,
            width: 30,
            height: 30,
            type: "square", // square, circle, hero
            color: "#e94560",
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: -12,
            gravity: 0.6,
            isJumping: false
        };

        // عناصر المتجر
        const shopItems = [
            { id: "red_sq", name: "المربع الأحمر", price: 0, color: "#e94560", type: "square", icon: "🟥", bought: true },
            { id: "blue_sq", name: "المربع الأزرق", price: 5, color: "#1e90ff", type: "square", icon: "🟦", bought: false },
            { id: "gold_circ", name: "الكرة الذهبية", price: 10, color: "#ffa500", type: "circle", icon: "🟡", bought: false },
            { id: "green_circ", name: "الكرة الخضراء", price: 15, color: "#2ed573", type: "circle", icon: "🟢", bought: false },
            { id: "ninja", name: "البطل النينجا", price: 25, color: "#ff4757", type: "hero", icon: "🥷", bought: false }
        ];

        // تصميم مراحل اللعبة
        const levels = [
            {
                platforms: [
                    { x: 0, y: 370, width: 800, height: 30, color: "#eebb4d" },
                    { x: 150, y: 290, width: 120, height: 15, color: "#00fff5" },
                    { x: 350, y: 210, width: 120, height: 15, color: "#00fff5" },
                    { x: 580, y: 140, width: 120, height: 15, color: "#00fff5" }
                ],
                hazards: [
                    { x: 300, y: 350, width: 30, height: 20, speed: 2, minX: 280, maxX: 450 }
                ],
                coins: [
                    { x: 200, y: 250, collected: false },
                    { x: 400, y: 170, collected: false }
                ],
                house: { x: 620, y: 80, width: 50, height: 60 }
            },
            {
                platforms: [
                    { x: 0, y: 370, width: 800, height: 30, color: "#eebb4d" },
                    { x: 100, y: 300, width: 100, height: 15, color: "#2ed573" },
                    { x: 280, y: 230, width: 100, height: 15, color: "#2ed573" },
                    { x: 460, y: 160, width: 100, height: 15, color: "#2ed573" },
                    { x: 650, y: 110, width: 100, height: 15, color: "#2ed573" }
                ],
                hazards: [
                    { x: 200, y: 350, width: 30, height: 20, speed: 3, minX: 150, maxX: 500 },
                    { x: 300, y: 210, width: 20, height: 20, speed: 2, minX: 280, maxX: 360 }
                ],
                coins: [
                    { x: 130, y: 260, collected: false },
                    { x: 310, y: 190, collected: false },
                    { x: 490, y: 120, collected: false }
                ],
                house: { x: 680, y: 50, width: 50, height: 60 }
            }
        ];

        let activeLevel = levels[0];

        const keys = {};
        window.addEventListener("keydown", (e) => { keys[e.code] = true; });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function openShop() {
            renderShop();
            document.getElementById("shopModal").style.display = "flex";
        }

        function closeShop() {
            document.getElementById("shopModal").style.display = "none";
        }

        function renderShop() {
            const grid = document.getElementById("shopGrid");
            grid.innerHTML = "";
            shopItems.forEach(item => {
                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div style="font-size:30px">${item.icon}</div>
                    <div><b>${item.name}</b></div>
                    <div>${item.bought ? "مملوك" : item.price + " 🪙"}</div>
                    <button onclick="handleShopClick('${item.id}')">
                        ${item.bought ? "تفعيل" : "شراء"}
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function handleShopClick(id) {
            const item = shopItems.find(i => i.id === id);
            if (item.bought) {
                player.color = item.color;
                player.type = item.type;
            } else if (coins >= item.price) {
                coins -= item.price;
                item.bought = true;
                player.color = item.color;
                player.type = item.type;
                document.getElementById("coinCount").innerText = coins;
            }
            renderShop();
        }

        function resetPlayer() {
            player.x = 40;
            player.y = 300;
            player.velocityX = 0;
            player.velocityY = 0;
        }

        function update() {
            if (keys["ArrowRight"]) player.velocityX = player.speed;
            else if (keys["ArrowLeft"]) player.velocityX = -player.speed;
            else player.velocityX = 0;

            if ((keys["Space"] || keys["ArrowUp"]) && !player.isJumping) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }

            player.velocityY += player.gravity;
            player.x += player.velocityX;
            player.y += player.velocityY;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // التصادم مع المنصات
            player.isJumping = true;
            activeLevel.platforms.forEach(platform => {
                if (
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y + player.height <= platform.y + player.velocityY &&
                    player.y + player.height + player.velocityY >= platform.y
                ) {
                    player.isJumping = false;
                    player.velocityY = 0;
                    player.y = platform.y - player.height;
                }
            });

            // تحريك الحواجز والتصادم معها
            activeLevel.hazards.forEach(h => {
                h.x += h.speed;
                if (h.x < h.minX || h.x + h.width > h.maxX) h.speed *= -1;

                if (
                    player.x < h.x + h.width &&
                    player.x + player.width > h.x &&
                    player.y < h.y + h.height &&
                    player.y + player.height > h.y
                ) {
                    resetPlayer(); // الخسارة والعودة للبداية عند لمس الحاجز
                }
            });

            // جمع الذهب
            activeLevel.coins.forEach(coin => {
                if (!coin.collected &&
                    player.x < coin.x + 15 &&
                    player.x + player.width > coin.x &&
                    player.y < coin.y + 15 &&
                    player.y + player.height > coin.y
                ) {
                    coin.collected = true;
                    coins += 2;
                    document.getElementById("coinCount").innerText = coins;
                }
            });

            // الوصول إلى البيت (الفوز بالمرحلة)
            const house = activeLevel.house;
            if (
                player.x < house.x + house.width &&
                player.x + player.width > house.x &&
                player.y < house.y + house.height &&
                player.y + player.height > house.y
            ) {
                if (currentLevel < levels.length) {
                    currentLevel++;
                    activeLevel = levels[currentLevel - 1];
                    document.getElementById("levelNum").innerText = currentLevel;
                    resetPlayer();
                } else {
                    alert("🎉 تهانينا! أكملت جميع المراحل ووصلت إلى البيت بسلام!");
                    currentLevel = 1;
                    activeLevel = levels[0];
                    resetPlayer();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم المنصات
            activeLevel.platforms.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.width, p.height);
            });

            // رسم الحواجز (الأشواك/الأعداء)
            activeLevel.hazards.forEach(h => {
                ctx.fillStyle = "#ff4757";
                ctx.fillRect(h.x, h.y, h.width, h.height);
            });

            // رسم الذهب
            activeLevel.coins.forEach(c => {
                if (!c.collected) {
                    ctx.fillStyle = "#ffdd59";
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // رسم البيت (الهدف)
            const h = activeLevel.house;
            ctx.fillStyle = "#ff6b6b"; // لون جدران البيت
            ctx.fillRect(h.x, h.y + 20, h.width, h.height - 20);
            ctx.fillStyle = "#1e90ff"; // السقف
            ctx.beginPath();
            ctx.moveTo(h.x - 5, h.y + 20);
            ctx.lineTo(h.x + h.width / 2, h.y);
            ctx.lineTo(h.x + h.width + 5, h.y + 20);
            ctx.fill();

            // رسم اللاعب بحسب الشكل والمظهر
            ctx.fillStyle = player.color;
            if (player.type === "circle") {
                ctx.beginPath();
                ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2, 0, Math.PI * 2);
                ctx.fill();
            } else if (player.type === "hero") {
                ctx.fillRect(player.x, player.y, player.width, player.height);
                ctx.fillStyle = "#ffffff"; // عيون البطل
                ctx.fillRect(player.x + 18, player.y + 6, 8, 5);
            } else {
                ctx.fillRect(player.x, player.y, player.width, player.height);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
