<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Leap</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            flex-direction: column;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            border: 4px solid #16213e;
            background-color: #0f3460;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .stats {
            font-size: 20px;
            margin: 10px 0;
            color: #ffdd59;
            font-weight: bold;
        }
        .shop {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .shop-btn {
            padding: 10px 15px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .shop-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h2>Pixel Leap</h2>
        <div class="stats">الذهب: <span id="coinCount">0</span> 🪙</div>
        
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div class="shop">
            <button class="shop-btn" id="buyRed" style="background: #e94560; color: white;" onclick="selectSkin('#e94560', 0)">الأحمر (مجاني)</button>
            <button class="shop-btn" id="buyGreen" style="background: #2ed573; color: white;" onclick="buySkin('#2ed573', 5, 'buyGreen')">الأخضر (5 ذهبات)</button>
            <button class="shop-btn" id="buyPurple" style="background: #a55eea; color: white;" onclick="buySkin('#a55eea', 10, 'buyPurple')">البنفسجي (10 ذهبات)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let coins = 0;
        const unlockedSkins = ["#e94560"];

        const player = {
            x: 50,
            y: 300,
            width: 30,
            height: 30,
            color: "#e94560",
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpPower: -12,
            gravity: 0.6,
            isJumping: false
        };

        const platforms = [
            { x: 0, y: 370, width: 800, height: 30, color: "#eebb4d" },
            { x: 150, y: 290, width: 120, height: 15, color: "#00fff5" },
            { x: 350, y: 210, width: 120, height: 15, color: "#00fff5" },
            { x: 550, y: 130, width: 120, height: 15, color: "#00fff5" }
        ];

        // قطع الذهب
        let goldCoins = [
            { x: 200, y: 250, size: 12, collected: false },
            { x: 400, y: 170, size: 12, collected: false },
            { x: 600, y: 90, size: 12, collected: false }
        ];

        const keys = {};

        window.addEventListener("keydown", (e) => { keys[e.code] = true; });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        function buySkin(color, price, btnId) {
            if (coins >= price && !unlockedSkins.includes(color)) {
                coins -= price;
                unlockedSkins.push(color);
                player.color = color;
                document.getElementById("coinCount").innerText = coins;
                document.getElementById(btnId).innerText = "تم الشراء (مفعل)";
            } else if (unlockedSkins.includes(color)) {
                player.color = color;
            }
        }

        function selectSkin(color, price) {
            if (unlockedSkins.includes(color)) {
                player.color = color;
            }
        }

        function resetCoinsIfAllCollected() {
            const allCollected = goldCoins.every(c => c.collected);
            if (allCollected) {
                setTimeout(() => {
                    goldCoins.forEach(c => c.collected = false);
                }, 1000);
            }
        }

        function update() {
            if (keys["ArrowRight"]) player.velocityX = player.speed;
            else if (keys["ArrowLeft"]) player.velocityX = -player.speed;
            else player.velocityX = 0;

            if ((keys["Space"] || keys["ArrowUp"]) && !player.isJumping) {
                player.velocityY = player.jumpPower;
                player.isJumping = true;
            }

            player.velocityY += player.gravity;
            player.x += player.velocityX;
            player.y += player.velocityY;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.isJumping = true;
            platforms.forEach(platform => {
                if (
                    player.x < platform.x + platform.width &&
                    player.x + player.width > platform.x &&
                    player.y + player.height <= platform.y + player.velocityY &&
                    player.y + player.height + player.velocityY >= platform.y
                ) {
                    player.isJumping = false;
                    player.velocityY = 0;
                    player.y = platform.y - player.height;
                }
            });

            // جمع الذهب
            goldCoins.forEach(coin => {
                if (!coin.collected &&
                    player.x < coin.x + coin.size &&
                    player.x + player.width > coin.x &&
                    player.y < coin.y + coin.size &&
                    player.y + player.height > coin.y
                ) {
                    coin.collected = true;
                    coins++;
                    document.getElementById("coinCount").innerText = coins;
                    resetCoinsIfAllCollected();
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم المنصات
            platforms.forEach(platform => {
                ctx.fillStyle = platform.color;
                ctx.fillRect(platform.x, platform.y, platform.width, platform.height);
            });

            // رسم قطع الذهب
            goldCoins.forEach(coin => {
                if (!coin.collected) {
                    ctx.fillStyle = "#ffdd59";
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // رسم اللاعب
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
